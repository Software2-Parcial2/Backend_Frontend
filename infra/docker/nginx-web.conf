server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Los remotos (Vue/Angular) los carga el shell desde otro origen: necesitan CORS abierto (solo desarrollo).
  # El CORS de la API vive unicamente en el gateway.
  add_header Access-Control-Allow-Origin * always;

  location = /healthz { access_log off; return 200 "ok"; }

  # El manifest y los service workers no deben quedar en cache.
  location ~* (mf-manifest\.json|remoteEntry\.(js|json)|sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin * always;
    try_files $uri =404;
  }

  # SPA: rutas de react-router / Vue vuelven a index.html.
  location / { try_files $uri $uri/ /index.html; }
}
