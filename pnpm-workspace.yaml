packages:
  - "apps/shell"
  - "apps/remote-vue"
  - "apps/remote-angular"
  - "apps/pwa-paciente"
  - "packages/*"
  - "scripts"
  - "services/ms1-identidad"
  - "services/ms3-citas"
  - "services/ms5-imagenes/api"
  - "services/ms7-inteligencia/api"
  - "services/ms8-notificaciones"
allowBuilds:
  '@apollo/protobufjs': true
  '@google/genai': true
  '@scarf/scarf': true
  protobufjs: true
injectWorkspacePackages: true
# @analogjs/vite-plugin-angular usa la API de TypeScript 6 sin declararla como dependencia; sin esto pnpm le da la 7.x del workspace (ts.createPrinter no existe).
packageExtensions:
  "@analogjs/vite-plugin-angular":
    dependencies:
      typescript: "~6.0.3"
