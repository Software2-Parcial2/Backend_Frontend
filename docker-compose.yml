  # ms5-api:
  #   build: ./services/ms5-imagenes/api
  #   env_file: .env
  #   ports: ["3005:3000"]
  # ms5-inference:
  #   build: ./services/ms5-imagenes/inference
  #   ports: ["8005:8000"]
  # ms7-api:
  #   build: ./services/ms7-inteligencia/api
  #   env_file: .env
  #   ports: ["3007:3000"]
  # ms7-ml:
  #   build: ./services/ms7-inteligencia/ml
  #   ports: ["8007:8000"]
  # ms7-whisper:
  #   build: ./services/ms7-inteligencia/whisper
  #   ports: ["8017:8000"]
  # ms8-notificaciones:
  #   build: ./services/ms8-notificaciones
  #   env_file: .env
  #   ports: ["3008:3000"]
  # ms6-facturacion:
  #   build: ./services/ms6-facturacion
