# SIGEC - infraestructura local (desarrollo)
# Uso: copia .env.example a .env y ejecuta: docker compose up -d
# Los servicios de negocio se agregan al final cuando tengan su Dockerfile.

name: sigec

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  dynamodb:
    image: amazon/dynamodb-local:latest
    # Solo desarrollo: el volumen nombrado nuevo es de root y la imagen corre como "dynamodblocal",
    # asi que sin esto SQLite no puede abrir /data ("unable to open database file").
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/data

  # Almacenamiento compatible con S3 (reemplaza a MinIO, cuyas imagenes ya no se publican).
  # Sin credenciales en desarrollo; en AWS se usara S3 real.
  s3:
    image: chrislusf/seaweedfs:latest
    # Con autenticacion: sin esto SeaweedFS permite crear, subir y leer SIN credenciales (bucket publico de hecho).
    # La configuracion de identidades se genera al arrancar con las claves del .env (no hay archivo con secretos en el repo).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"sigec","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec /usr/bin/weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "9000:8333"
    volumes:
      - s3_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      # Coloca aqui el realm exportado (realm-sigec.json). Si la carpeta esta vacia, se crea sin realm.
      - ./infra/keycloak:/opt/keycloak/data/import:ro,z
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: America/La_Paz
      TZ: America/La_Paz
      # Los workflows leen sus secretos de las variables de entorno ($env.X): nada se guarda en la base de n8n ni en el repo.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      MS8_INTERNAL_SECRET: ${MS8_INTERNAL_SECRET:-}
      MS8_URL: ${MS8_URL_FROM_N8N:-http://host.docker.internal:3008}
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN:-}
      MAILTRAP_INBOX_ID: ${MAILTRAP_INBOX_ID:-}
      MAILTRAP_API_URL: ${MAILTRAP_API_URL:-https://sandbox.api.mailtrap.io}
      MAIL_FROM: ${MAIL_FROM:-no-reply@sigec.test}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # n8n (contenedor) -> MS8 (en el host)
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infra/n8n/workflows:/workflows:ro,z
    depends_on:
      postgres:
        condition: service_healthy

  # --- Servicios de negocio (descomentar cuando exista cada Dockerfile) ---
  # ms3-citas:
  #   build: ./services/ms3-citas
  #   env_file: .env
  #   ports: ["3003:3000"]
  #   depends_on: [dynamodb, rabbitmq, keycloak]
  # ms5-api:
  #   build: ./services/ms5-imagenes/api
  #   env_file: .env
  #   ports: ["3005:3000"]
  # Inferencia de radiografias (Python/TensorFlow). Imagen grande: solo se construye con el perfil "inferencia":
  #   docker compose --profile inferencia up -d --build ms5-inference
  # En desarrollo normalmente se ejecuta en el host (scripts/dev-services.sh start ms5-inference), puerto 8005.
  ms5-inference:
    profiles: ["inferencia"]
    build:
      context: .
      dockerfile: services/ms5-imagenes/inference/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ALLOW_STUB: "true"   # sin modelo entrenado usa el modelo FICTICIO NO CLINICO
    volumes:
      - ./ml/pneumonia/models:/models:ro,z
    ports: ["8005:8000"]
    depends_on: [rabbitmq, s3]
  # ms7-api:
  #   build: ./services/ms7-inteligencia/api
  #   env_file: .env
  #   ports: ["3007:3000"]
  # MS7 ML (inasistencia + segmentacion de demanda). Los modelos se generan con ml/no-show/train.py y ml/demanda/segmentar.py.
  # En desarrollo: scripts/dev-services.sh start ms7-ml (puerto 8007).
  ms7-ml:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: services/ms7-inteligencia/ml/Dockerfile
    environment:
      ML_API_KEY: ${ML_API_KEY:-}
    volumes:
      - ./ml/no-show/models:/models/no-show:ro,z
      - ./ml/demanda/models:/models/demanda:ro,z
    ports: ["8007:8007"]
  # Embeddings multilingues para el RAG de MS7 (servicio aparte de Whisper: ver docs/inteligencia.md). Desarrollo: scripts/dev-services.sh start ms7-embeddings (8027).
  ms7-embeddings:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: services/ms7-inteligencia/embeddings/Dockerfile
    environment:
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
    volumes:
      - ms7_models:/models
    ports: ["8027:8027"]
  # ms7-whisper:
  #   build: ./services/ms7-inteligencia/whisper
  #   ports: ["8017:8000"]
  # ms8-notificaciones:
  #   build: ./services/ms8-notificaciones
  #   env_file: .env
  #   ports: ["3008:3000"]
  # ms6-facturacion:
  #   build: ./services/ms6-facturacion
  #   env_file: .env
  #   ports: ["8006:8000"]

volumes:
  pg_data:
  mongo_data:
  s3_data:
  rabbit_data:
  n8n_data:
  dynamodb_data:
  ms7_models:
