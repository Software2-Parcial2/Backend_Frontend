        - { action: rebuild, path: packages, ignore: [node_modules, dist, target, vendor, .angular, '**/*.md'] }
  shell:
    develop:
      watch:
        - { action: rebuild, path: apps/shell, ignore: [node_modules, dist, target, vendor, .angular, '**/*.md'] }
        - { action: rebuild, path: packages, ignore: [node_modules, dist, target, vendor, .angular, '**/*.md'] }
  pwa-paciente:
    develop:
      watch:
        - { action: rebuild, path: apps/pwa-paciente, ignore: [node_modules, dist, target, vendor, .angular, '**/*.md'] }
        - { action: rebuild, path: packages, ignore: [node_modules, dist, target, vendor, .angular, '**/*.md'] }
  remote-vue:
    develop:
      watch:
        - { action: rebuild, path: apps/remote-vue, ignore: [node_modules, dist, target, vendor, .angular, '**/*.md'] }
        - { action: rebuild, path: packages, ignore: [node_modules, dist, target, vendor, .angular, '**/*.md'] }
  remote-angular:
