spring:
  application:
    name: ms4-historias
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ms4_historias}
    username: ${DB_USER:${POSTGRES_USER:sigec}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:cambia_esto}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:sigec}
    password: ${RABBITMQ_PASSWORD:cambia_esto}
    # Publisher confirms: el relay del outbox espera la confirmacion del broker antes de marcar published_at.
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/sigec}

server:
  port: ${PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
